[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "agents", "training", "experimentos", "scripts"]

[project]
name = "truco-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gamekit",
    "gymnasium>=1.2.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "sb3-contrib>=2.8.0",
    "stable-baselines3>=2.8.0",
    "tensorboard>=2.20.0",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]  # ternary not always clearer

[tool.ruff.lint.per-file-ignores]
"scripts/pretrain_bc.py" = ["E501"]  # CLI usage examples in docstring can't be line-wrapped

[tool.ruff.lint.isort]
known-first-party = ["engine", "agents", "training", "experimentos"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
gamekit = { git = "https://github.com/guidodinello/gamekit", branch = "main" }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
