# Baseline CI, adapted from gamekit's ci.yml / dev-standards'
# templates/ci/python-ci.yml: Lint + Typecheck + Tests as the required gate (pre-commit
# only runs locally, so CI is the only place a required check can enforce it).
#
# torch: pyproject.toml exposes it as the mutually exclusive `cpu` / `cu128` extras,
# each pinned to its own index via tool.uv.sources, both resolved in uv.lock. CI syncs
# `--extra cpu` (no CUDA wheels, no multi-GB nvidia downloads); the laptop installs
# `.[cu128]`. `--locked` fails the job if uv.lock is stale. stable-baselines3 also
# depends on torch, so a sync with neither extra would pull PyPI's CUDA build — every
# job that needs torch must pass --extra cpu. Lint doesn't need it (--only-dev).
#
# Required status checks (no matrix, so contexts are the bare job names):
#   Lint Python, Typecheck Python, Tests (Python)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Switchable per repo via the CI_RUNNERS variable (JSON array of labels);
    # unset means GitHub-hosted ubuntu-latest. See dev-standards' README § CI runners.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --only-dev

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

  typecheck-python:
    name: Typecheck Python
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full dependency set on purpose: without gamekit / stable_baselines3 installed,
      # mypy falls back to ignore_missing_imports and under-reports real errors.
      - name: Install dependencies
        run: uv sync --locked --extra cpu

      - name: mypy
        run: uv run python -m mypy .

  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra cpu

      - name: Run tests
        run: uv run pytest
