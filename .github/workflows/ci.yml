# Baseline CI, adapted from gamekit's ci.yml / dev-standards'
# templates/ci/python-ci.yml: Lint + Typecheck + Tests as the required gate (pre-commit
# only runs locally, so CI is the only place a required check can enforce it).
#
# torch: pyproject.toml has two mutually exclusive variants, each pinned to its own
# index via tool.uv.sources and both resolved in uv.lock: `cu128` (CUDA wheels) is a
# *default dependency group*, so plain `uv sync` / `uv run` on the laptop keep it; `cpu`
# is the only extra. CI opts into CPU with `--extra cpu --no-group cu128` (no CUDA
# wheels, no multi-GB nvidia downloads). `--locked` fails the job if uv.lock is stale.
# `--extra cpu` alone errors on purpose (conflicts with the default cu128 group).
# Lint doesn't need torch (--only-dev). Every run step is `uv run --no-sync`: a syncing
# `uv run` would re-sync the default set and swap the CPU wheel for the CUDA one.
#
# Required status checks (no matrix, so contexts are the bare job names):
#   Lint Python, Typecheck Python, Tests (Python)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Switchable per repo via the CI_RUNNERS variable (JSON array of labels);
    # unset means GitHub-hosted ubuntu-latest. See dev-standards' README § CI runners.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --only-dev

      - name: ruff format check
        run: uv run --no-sync ruff format --check .

      - name: ruff lint
        run: uv run --no-sync ruff check .

  typecheck-python:
    name: Typecheck Python
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full dependency set on purpose: without gamekit / stable_baselines3 installed,
      # mypy falls back to ignore_missing_imports and under-reports real errors.
      - name: Install dependencies
        run: uv sync --locked --extra cpu --no-group cu128

      - name: mypy
        run: uv run --no-sync python -m mypy .

  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra cpu --no-group cu128

      - name: Run tests
        run: uv run --no-sync pytest
