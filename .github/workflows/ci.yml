  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Persistent homelab runners (named homelab-*) keep ~/.cache/uv on disk, so uploading
          # it is slow and pointless there; keyed on the runner name, not runner.environment,
          # because ephemeral self-hosted services (Ubicloud) need the cache (fitted Issue 361).
          enable-cache: ${{ !contains(runner.name, 'homelab') }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra cpu --no-group cu128

      - name: Run tests
        run: uv run --no-sync pytest

  # Audits the workflow files with zizmor (from dev-standards'
  # templates/ci/python-ci.yml). It is in the `CI` job's needs:, so a finding
  # blocks the merge. The version is pinned so a new upstream audit cannot turn
  # this red between runs; Dependabot does not bump a `uvx` pin, so bump it by
  # hand. GH_TOKEN is the read-only workflow token; it enables the online audits
  # that check each pinned SHA really belongs to the tagged repo.
  audit-workflows:
    name: Audit workflows
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github .github/workflows

  ci:
    name: CI
    needs:
      - lint-python
      - typecheck-python
      - test-python
      - audit-workflows
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required job finished as: $r"
              exit 1
            fi
          done
