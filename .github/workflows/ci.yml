# Baseline CI, adapted from gamekit's ci.yml / dev-standards'
# templates/ci/python-ci.yml: Lint + Typecheck + Tests as the required gate (pre-commit
# only runs locally, so CI is the only place a required check can enforce it).
#
# torch: pyproject.toml has two mutually exclusive variants, each pinned to its own
# index via tool.uv.sources and both resolved in uv.lock: `cu128` (CUDA wheels) is a
# *default dependency group*, so plain `uv sync` / `uv run` on the laptop keep it; `cpu`
# is the only extra. CI opts into CPU with `--extra cpu --no-group cu128` (no CUDA
# wheels, no multi-GB nvidia downloads). `--locked` fails the job if uv.lock is stale.
# `--extra cpu` alone errors on purpose (conflicts with the default cu128 group).
# Lint doesn't need torch (--only-dev). Every run step is `uv run --no-sync`: a syncing
# `uv run` would re-sync the default set and swap the CPU wheel for the CUDA one.
#
# Required status check: only the aggregate `CI` job below, pinned to the GitHub
# Actions app in the branch ruleset ({"context": "CI", "integration_id": 15368}).
# It fails if any job it needs failed or was cancelled, so a new job only needs
# adding to its `needs:` list.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded pull_request runs are cancelled. Every other event (push to main,
# workflow_dispatch) gets a unique group, so it is never cancelled or replaced
# by a newer pending run -- GitHub drops a pending run in the same group even
# with cancel-in-progress false, which could leave a main commit with no CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Switchable per repo via the CI_RUNNERS variable (JSON array of labels);
    # unset means GitHub-hosted ubuntu-latest. See dev-standards' README § CI runners.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Persistent homelab runners (named homelab-*) keep ~/.cache/uv on disk, so uploading
          # it is slow and pointless there; keyed on the runner name, not runner.environment,
          # because ephemeral self-hosted services (Ubicloud) need the cache (fitted Issue 361).
          enable-cache: ${{ !contains(runner.name, 'homelab') }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --only-dev

      - name: ruff format check
        run: uv run --no-sync ruff format --check .

      - name: ruff lint
