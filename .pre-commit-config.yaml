repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10  # keep in step with the ruff pinned in uv.lock (CI runs that one)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: scripts/precommit-mypy.sh
        language: script
        types: [python]
        pass_filenames: false
